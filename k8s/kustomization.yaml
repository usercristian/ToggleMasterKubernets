apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: togglemaster

resources:
  - configmap.yaml
  - secret.yaml
  - aws-auth.yaml
  - auth-deployment.yaml
  - flag-deployment.yaml
  - targeting-deployment.yaml
  - evaluation-deployment.yaml
  - analytics-deployment.yaml
  - analytics-hpa.yaml
  - evaluation-hpa.yaml
  - ingress.yaml
  - nginx-ingress.yaml

images:
  - name: auth-service
    newName: 429464396702.dkr.ecr.us-east-1.amazonaws.com/auth-service
    newTag: latest
  - name: flag-service
    newName: 429464396702.dkr.ecr.us-east-1.amazonaws.com/flag-service
    newTag: latest
  - name: targeting-service
    newName: 429464396702.dkr.ecr.us-east-1.amazonaws.com/targeting-service
    newTag: latest
  - name: evaluation-service
    newName: 429464396702.dkr.ecr.us-east-1.amazonaws.com/evaluation-service
    newTag: latest
  - name: analytics-service
    newName: 429464396702.dkr.ecr.us-east-1.amazonaws.com/analytics-service
    newTag: latest